name: Collector execution
run-name: '${{ inputs.command }} / ${{ inputs.job_key || github.run_id }}'
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Worker가 요청한 독립 작업'
        type: choice
        default: watch-slots
        options: [watch-slots, daily-reports, check-policies, send-outbox]
      job_key:
        description: 'Worker 실행 키 (직접 실행은 비워 두세요)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: tenniswatch-collector
  cancel-in-progress: false
jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WATCH_DAYS_AHEAD: ${{ vars.WATCH_DAYS_AHEAD || '7' }}
      JOB_COMMAND: ${{ inputs.command }}
      JOB_KEY: ${{ inputs.job_key || format('manual:{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - run: python -m playwright install --with-deps chromium
        if: inputs.command == 'watch-slots' || inputs.command == 'daily-reports'
      - name: Run independent collector task and persist result
        run: python -m tenniswatch.scheduled_jobs "$JOB_COMMAND" --job-key "$JOB_KEY"
