# Compatibility entry point; all scheduling is owned by the Worker.
name: Manual reservation opening monitor
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tenniswatch-collector
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python -m tenniswatch.scheduled_jobs check-policies --job-key "manual:$GITHUB_RUN_ID"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
